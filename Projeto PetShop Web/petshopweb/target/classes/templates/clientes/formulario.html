
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Clientes - PetShop Web</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000015;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .botoes {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button, .voltar {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            text-decoration: none;
        }

        button {
            background-color: #2563eb;
            color: white;
        }

        .voltar {
            background-color: #6b7280;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <h1 th:text="${cliente.idCliente == null}
            ? 'Cadastrar Cliente'
            : 'Editar Cliente'">
        Cadastrar Cliente
    </h1>

    <form th:action="@{/clientes/salvar}"
          th:object="${cliente}"
          method="post">

        <!-- ID oculto para identificar edições -->
        <input type="hidden"
               th:field="*{idCliente}">

        <label for="nome">Nome completo</label>
        <input type="text"
               id="nome"
               th:field="*{nome}"
               required
               maxlength="100">

        <label for="cpf">CPF</label>
        <input type="text"
               id="cpf"
               th:field="*{cpf}"
               maxlength="14"
               placeholder="000.000.000-00">

        <label for="telefone">Telefone</label>
        <input type="text"
               id="telefone"
               th:field="*{telefone}"
               maxlength="20"
               placeholder="(47) 99999-9999">

        <label for="email">E-mail</label>
        <input type="email"
               id="email"
               th:field="*{email}"
               maxlength="100">

        <label for="endereco">Endereço</label>
        <input type="text"
               id="endereco"
               th:field="*{endereco}"
               maxlength="200">

        <div class="botoes">

            <button type="submit">
                Salvar Cliente
            </button>

            <a class="voltar"
               th:href="@{/clientes}">
                Cancelar
            </a>

        </div>

    </form>

</div>

</body>
</html>
