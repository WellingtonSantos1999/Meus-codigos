
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Funcionários - PetShop Web</title>

    <style>

        .botao-inicio {
            display: inline-block;
            background-color: #64748b;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
            margin: 5px;
        }

        .botao-inicio:hover {
            background-color: #475569;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000015;
        }

        h1 {
            color: #333;
        }

        .botao {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .botao-editar {
            background-color: #eab308;
            color: black;
        }

        .botao-excluir {
            background-color: #dc2626;
        }

        .botao-voltar {
            background-color: #6b7280;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #2563eb;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9fafb;
        }

        .acoes {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .acoes form {
            margin: 0;
        }

        .sucesso {
            color: #166534;
            background-color: #dcfce7;
            padding: 12px;
            margin-top: 15px;
            border-radius: 5px;
        }

        .erro {
            color: #991b1b;
            background-color: #fee2e2;
            padding: 12px;
            margin-top: 15px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Gerenciamento de Funcionários</h1>

    <a th:href="@{/}" class="botao-inicio">
        🏠 Voltar ao Início
    </a>

    <a class="botao"
       th:href="@{/funcionarios/novo}">
        + Novo Funcionário
    </a>

    <a class="botao botao-voltar"
       th:href="@{/clientes}">
        Clientes
    </a>

    <a class="botao botao-voltar"
       th:href="@{/pets}">
        Pets
    </a>

    <!-- Mensagens de sucesso e erro -->
    <div class="sucesso"
         th:if="${sucesso}"
         th:text="${sucesso}">
    </div>

    <div class="erro"
         th:if="${erro}"
         th:text="${erro}">
    </div>

    <table>

        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>CPF</th>
            <th>Telefone</th>
            <th>Cargo</th>
            <th>Ações</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="funcionario : ${funcionarios}">

            <td th:text="${funcionario.idFuncionario}"></td>

            <td th:text="${funcionario.nome}"></td>

            <td th:text="${funcionario.cpf}"></td>

            <td th:text="${funcionario.telefone}"></td>

            <td th:text="${funcionario.cargo}"></td>

            <td>
                <div class="acoes">

                    <a class="botao botao-editar"
                       th:href="@{/funcionarios/editar/{id}(id=${funcionario.idFuncionario})}">
                        Editar
                    </a>

                    <form th:action="@{/funcionarios/excluir/{id}(id=${funcionario.idFuncionario})}"
                          method="post"
                          onsubmit="return confirm('Deseja realmente excluir este funcionário?');">

                        <button type="submit"
                                class="botao botao-excluir">
                            Excluir
                        </button>

                    </form>

                </div>
            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(funcionarios)}">
            <td colspan="6">
                Nenhum funcionário cadastrado.
            </td>
        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
