
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pagamento - PetShop Web</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000015;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 15px;
            background-color: white;
        }

        .aviso {
            background-color: #eff6ff;
            color: #1e40af;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .botoes {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button, .voltar {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            text-decoration: none;
        }

        button {
            background-color: #2563eb;
            color: white;
        }

        .voltar {
            background-color: #6b7280;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <h1 th:text="${pagamento.idPagamento == null}
        ? 'Cadastrar Pagamento'
        : 'Editar Pagamento'">
        Cadastrar Pagamento
    </h1>

    <div class="aviso">
        Selecione o agendamento e informe
        os dados do pagamento.
    </div>

    <form th:action="@{/pagamentos/salvar}"
          th:object="${pagamento}"
          method="post">

        <!-- ID DO PAGAMENTO -->

        <input type="hidden"
               th:field="*{idPagamento}">


        <!-- SELECIONAR AGENDAMENTO -->

        <label for="idAgendamento">
            Agendamento
        </label>

        <select id="idAgendamento"
                name="idAgendamento"
                required>

            <option value="">
                Selecione um Agendamento
            </option>

            <option
                    th:each="agendamento : ${agendamentos}"
                    th:value="${agendamento.idAgendamento}"
                    th:text="${'Agendamento #' +
                    agendamento.idAgendamento +
                    ' - ' + agendamento.pet.nome +
                    ' - ' + agendamento.servico.nome}"
                    th:selected="${pagamento.agendamento != null
                    and pagamento.agendamento.idAgendamento
                    == agendamento.idAgendamento}">
            </option>

        </select>


        <!-- VALOR -->

        <label for="valor">
            Valor do Pagamento (R$)
        </label>

        <input type="number"
               id="valor"
               th:field="*{valor}"
               min="0"
               max="99999999.99"
               step="0.01"
               placeholder="Ex.: 50.00"
               required>


        <!-- DATA -->

        <label for="data">
            Data do Pagamento
        </label>

        <input type="date"
               id="data"
               th:field="*{data}"
               required>


        <!-- FORMA DE PAGAMENTO -->

        <label for="formaPagamento">
            Forma de Pagamento
        </label>

        <select id="formaPagamento"
                th:field="*{formaPagamento}"
                required>

            <option value="">
                Selecione a forma de pagamento
            </option>

            <option value="PIX">
                PIX
            </option>

            <option value="Dinheiro">
                Dinheiro
            </option>

            <option value="Cartão de Crédito">
                Cartão de Crédito
            </option>

            <option value="Cartão de Débito">
                Cartão de Débito
            </option>

        </select>


        <!-- STATUS -->

        <label for="status">
            Status do Pagamento
        </label>

        <select id="status"
                th:field="*{status}"
                required>

            <option value="Pendente">
                Pendente
            </option>

            <option value="Pago">
                Pago
            </option>

            <option value="Cancelado">
                Cancelado
            </option>

        </select>


        <!-- BOTOES -->

        <div class="botoes">

            <button type="submit">
                Salvar Pagamento
            </button>

            <a class="voltar"
               th:href="@{/pagamentos}">
                Cancelar
            </a>

        </div>

    </form>

</div>

</body>
</html>
