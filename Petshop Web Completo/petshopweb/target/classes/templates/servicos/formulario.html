
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Serviços - PetShop Web</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000015;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .botoes {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button, .voltar {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            text-decoration: none;
        }

        button {
            background-color: #2563eb;
            color: white;
        }

        .voltar {
            background-color: #6b7280;
            color: white;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/background.css}">
</head>

<body>


<!-- MENSAGEM DE ERRO -->
<div th:if="${erro}"
     style="background-color: #f8d7da;
            color: #842029;
            padding: 12px;
            border: 1px solid #f5c2c7;
            border-radius: 6px;
            margin: 15px 0;
            font-weight: bold;">

    <span th:text="${erro}"></span>

</div>


<div class="container">

    <h1 th:text="${servico.idServico == null}
        ? 'Cadastrar Serviço'
        : 'Editar Serviço'">
        Cadastrar Serviço
    </h1>

    <form th:action="@{/servicos/salvar}"
          th:object="${servico}"
          method="post">

        <!-- ID oculto utilizado na edição -->
        <input type="hidden"
               th:field="*{idServico}">

        <label for="nome">Nome do Serviço</label>
        <input type="text"
               id="nome"
               th:field="*{nome}"
               maxlength="100"
               placeholder="Ex.: Banho completo"
               required>

        <label for="descricao">Descrição</label>
        <textarea id="descricao"
                  th:field="*{descricao}"
                  maxlength="200"
                  placeholder="Descreva o serviço oferecido">
        </textarea>

        <label for="valor">Valor (R$)</label>
        <input type="number"
               id="valor"
               th:field="*{valor}"
               min="0"
               max="99999999.99"
               step="0.01"
               placeholder="Ex.: 50.00">

        <label for="duracao">Duração (minutos)</label>
        <input type="number"
               id="duracao"
               th:field="*{duracao}"
               min="0"
               step="1"
               placeholder="Ex.: 60">

        <div class="botoes">

            <button type="submit">
                Salvar Serviço
            </button>

            <a class="voltar"
               th:href="@{/servicos}">
                Cancelar
            </a>

        </div>

    </form>

</div>

</body>
</html>
